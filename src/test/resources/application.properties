spring.application.name=Sistema de Gestao para Artesa - Testes

# Banco de dados de testes isolado (evita que deleteAll dos testes limpe artesa.db de desenvolvimento)
spring.datasource.url=jdbc:sqlite:artesa_test.db
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

spring.datasource.hikari.maximum-pool-size=1
