spring.application.name=Sistema de Gestao para Artesa

# Banco de dados: SQLite
spring.datasource.url=jdbc:sqlite:artesa.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Schema controlado manualmente pelo schema.sql
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Hibernate/JPA apenas mapeia as entidades
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Servidor REST embutido
server.port=8080

# SQLite nao lida bem com varias conexoes
spring.datasource.hikari.maximum-pool-size=1