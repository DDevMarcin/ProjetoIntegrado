spring.application.name=Sistema de Gestao para Artesa

# Banco de dados: SQLite (arquivo local, criado automaticamente)
spring.datasource.url=jdbc:sqlite:artesa.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Hibernate + dialect SQLite
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Servidor REST embutido
server.port=8080

# Necessario ligado a Hikari: SQLite nao lida bem com varias conexoes
spring.datasource.hikari.maximum-pool-size=1